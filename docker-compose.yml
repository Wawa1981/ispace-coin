# Stack locale IDENTIQUE sur toutes les machines.
# Ports = .env (MySQL 3307, Redis 6379). App : composer dev:all → :8002
services:
  mysql:
    image: mysql:8.0
    container_name: ispace-mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
      MYSQL_DATABASE: "${DB_DATABASE:-ispace_coin}"
      MYSQL_USER: "${DB_USERNAME:-ispace_coin}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-ispace_coin}"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ispace_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ispace-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    # Si REDIS_PASSWORD est vide dans .env, Redis démarre sans mdp.
    # Sinon : même secret que sur toutes les machines.
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:-ispace_local}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ispace_local}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ispace_mysql_data:

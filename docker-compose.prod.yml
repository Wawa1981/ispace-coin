# iSpaceCoin — couches data PROD (MySQL 8.4 + Redis)
# L’app PHP tourne en php-fpm/nginx sur l’hôte (voir deploy/).
# Usage :
#   cp .env.production.example .env   # puis remplir
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Ports bindés en 127.0.0.1 seulement (pas exposés public).

services:
  mysql:
    image: mysql:8.4.6
    container_name: ispace-mysql-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE:-ispace_coin}"
      MYSQL_USER: "${DB_USERNAME:-ispace_coin}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --mysql-native-password=ON
    volumes:
      - ispace_mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: ispace-redis-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:?set REDIS_PASSWORD}"
      - --appendonly
      - "yes"
    volumes:
      - ispace_redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  ispace_mysql_prod_data:
  ispace_redis_prod_data:

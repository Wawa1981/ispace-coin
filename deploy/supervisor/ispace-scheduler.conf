; iSpaceCoin — Laravel scheduler (remplace le cron * * * * *)
; Copier vers /etc/supervisor/conf.d/ispace-scheduler.conf

[program:ispace-scheduler]
process_name=%(program_name)s
command=php /var/www/ispace-coin/artisan schedule:work
directory=/var/www/ispace-coin
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/ispace-coin/storage/logs/scheduler.log

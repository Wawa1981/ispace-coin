; iSpaceCoin — bitgo-server.js (optionnel, si CRYPTO_WALLET_DRIVER=bitgo)
; Nécessite Node 20+ et npm install à la racine du projet
; Copier vers /etc/supervisor/conf.d/ispace-bitgo.conf

[program:ispace-bitgo]
process_name=%(program_name)s
command=node /var/www/ispace-coin/bitgo-server.js
directory=/var/www/ispace-coin
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
environment=NODE_ENV="production"
redirect_stderr=true
stdout_logfile=/var/www/ispace-coin/storage/logs/bitgo-server.log

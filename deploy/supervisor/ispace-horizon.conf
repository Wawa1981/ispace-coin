; iSpaceCoin — Laravel Horizon (prod)
; Copier vers /etc/supervisor/conf.d/ispace-horizon.conf
; Puis : sudo supervisorctl reread && sudo supervisorctl update
;
; Adapter user= et directory=

[program:ispace-horizon]
process_name=%(program_name)s
command=php /var/www/ispace-coin/artisan horizon
directory=/var/www/ispace-coin
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/ispace-coin/storage/logs/horizon.log
stopwaitsecs=3600

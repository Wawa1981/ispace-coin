# iSpaceCoin — nginx (PHP-FPM)
# Adapter : root, server_name, socket php-fpm (8.3/8.4)
# SSL : certbot / let's encrypt sur le serveur

server {
    listen 80;
    listen [::]:80;
    server_name ton-domaine.example www.ton-domaine.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ton-domaine.example www.ton-domaine.example;

    # ssl_certificate     /etc/letsencrypt/live/ton-domaine.example/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ton-domaine.example/privkey.pem;

    root /var/www/ispace-coin/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Assets build Vite (long cache)
    location ^~ /build/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
